<!--
  Station 3 · Motion: animation, lights and shadows, procedural textures

  Room fragment, not a full page. js/core/museum-loader.js inserts it into:
    - index.html → one <a-scene> with all the rooms
    - room.html?station=3 → its own <a-scene>
  Top-level elements go inside #museum, unless they say otherwise with
  data-mount="scene" (scene root: survives hide-on-enter-ar) or data-mount="body".
  Relative URLs resolve against the page (the site root), not this folder.
-->

<!-- ============ STATION 3 · ANIMATION, LIGHT, TEXTURES ============ -->
<a-entity id="st2" museum-station="index: 2; name: Motion" position="0 0 -28">
  <a-entity canvas-panel="id: s2-title; width: 4.4" position="0 4.2 -6.8"></a-entity>

  <!-- Animations (left) -->
  <a-entity position="-3.6 0 -1.5" rotation="0 30 0">
    <a-cylinder radius="1.3" height="0.12" position="0 0.06 0" material="color: #2a3042; roughness: 0.6" shadow="receive: true"></a-cylinder>
    <a-box position="-0.75 1.0 0" width="0.42" height="0.42" depth="0.42" material="color: #ffb400; roughness: 0.35; metalness: 0.2" shadow="cast: true"
           animation="property: rotation; to: 360 360 0; loop: true; dur: 5000; easing: linear"></a-box>
    <a-sphere position="0 0.4 0" radius="0.22" material="color: #2ec4b6; roughness: 0.3" shadow="cast: true"
              animation="property: position; to: 0 1.5 0; dir: alternate; loop: true; dur: 900; easing: easeOutQuad"></a-sphere>
    <a-torus position="0.75 1.0 0" radius="0.22" radius-tubular="0.06" material="color: #ef2d5e; roughness: 0.3; metalness: 0.3" shadow="cast: true"
             animation__rot="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear"
             animation__scale="property: scale; to: 1.4 1.4 1.4; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"
             animation__color="property: material.color; type: color; to: #4cc9f0; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"></a-torus>
    <a-entity ui-button="label: View info; color: #e09e00; width: 0.62" info-toggle="#p-anim" position="-0.68 0.35 1.38"></a-entity>
    <!-- External (non-native) models and animations: glTF, Mixamo, AnimationMixer -->
    <a-entity ui-button="label: External; color: #e09e00; icon: ⇩; width: 0.62" info-toggle="#p-ext" position="0 0.35 1.38"></a-entity>
    <!-- How to export an animation from Blender to glTF for A-Frame -->
    <a-entity ui-button="label: Blender; color: #e87d0d; icon: B; width: 0.62" info-toggle="#p-blender" position="0.68 0.35 1.38"></a-entity>
    <a-entity id="p-anim" canvas-panel="id: anim; width: 2.4" popup position="0 2.6 0.5"></a-entity>
    <a-entity id="p-ext" canvas-panel="id: anim-external; width: 2.6" popup position="0 2.6 0.55"></a-entity>
    <a-entity id="p-blender" canvas-panel="id: blender-export; width: 2.7" popup position="0 2.65 0.6"></a-entity>
  </a-entity>

  <!-- Lights and shadows (center) -->
  <a-entity position="0 0 -2.6">
    <a-cylinder radius="1.5" height="0.12" position="0 0.06 0" material="color: #d8dce6; roughness: 0.8" shadow="receive: true"></a-cylinder>
    <a-torus-knot position="0 1.15 0" radius="0.36" radius-tubular="0.1" p="2" q="3"
                  material="color: #e9edf5; metalness: 0.6; roughness: 0.25" shadow="cast: true" spin="speed: 20"></a-torus-knot>
    <a-cylinder position="0.9 0.75 0" radius="0.06" height="1.4" material="color: #c9ced8" shadow="cast: true"></a-cylinder>
    <a-cylinder position="-0.45 0.75 0.78" radius="0.06" height="1.4" material="color: #c9ced8" shadow="cast: true"></a-cylinder>
    <a-cylinder position="-0.45 0.75 -0.78" radius="0.06" height="1.4" material="color: #c9ced8" shadow="cast: true"></a-cylinder>
    <!-- Orbiting point light (the animation rotates the parent) -->
    <a-entity position="0 1.9 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear">
      <a-entity id="s2-point" position="1.3 0 0"
                light="type: point; color: #ffb400; intensity: 4; distance: 8; decay: 1.2; castShadow: true; shadowMapWidth: 512; shadowMapHeight: 512"></a-entity>
      <a-sphere id="s2-bulb" position="1.3 0 0" radius="0.07" material="shader: flat; color: #ffb400"></a-sphere>
    </a-entity>
    <!-- Directional light with shadows aimed at the sculpture -->
    <a-entity id="s2-target" position="0 0 0"></a-entity>
    <a-entity position="3 7 3"
              light="type: directional; color: #fff4e0; intensity: 1.4; castShadow: true; target: #s2-target; shadowCameraLeft: -5; shadowCameraRight: 5; shadowCameraTop: 5; shadowCameraBottom: -5; shadowCameraFar: 20; shadowMapWidth: 1024; shadowMapHeight: 1024"></a-entity>
    <a-entity ui-button="label: View info; color: #e09e00" info-toggle="#p-light" position="-0.4 0.32 1.6"></a-entity>
    <a-entity ui-button="label: Light color; color: #e09e00; icon: ✦" light-color-cycle="light: #s2-point; bulb: #s2-bulb" position="0.4 0.32 1.6"></a-entity>
    <a-entity id="p-light" canvas-panel="id: light; width: 2.4" popup position="0 2.7 1.3"></a-entity>
  </a-entity>

  <!-- Procedural textures (right) -->
  <a-entity position="3.6 0 -1.5" rotation="0 -30 0">
    <a-box position="0 0.95 -0.35" width="2.3" height="1.9" depth="0.1" material="color: #1b2133; roughness: 0.9"></a-box>
    <a-box position="0 0.25 0" width="2.3" height="0.5" depth="0.6" material="color: #2a3042; roughness: 0.6"></a-box>
    <a-box position="-0.72 0.8 0.05" width="0.5" height="0.5" depth="0.5" canvas-texture="pattern: checker" shadow="cast: true" spin="speed: 25"></a-box>
    <a-sphere position="0 0.82 0.05" radius="0.3" canvas-texture="pattern: marble; size: 256" material="roughness: 0.2; metalness: 0" spin="speed: -20"></a-sphere>
    <a-plane position="0.72 0.82 0.05" width="0.55" height="0.55" plasma-texture material="shader: flat"></a-plane>
    <a-plane position="0 1.5 -0.28" width="0.7" height="0.7" svg-texture material="shader: flat"></a-plane>
    <a-entity ui-button="label: View info; color: #e09e00" info-toggle="#p-tex" position="0 0.25 0.33"></a-entity>
    <a-entity id="p-tex" canvas-panel="id: tex; width: 2.4" popup position="0 2.6 0.6"></a-entity>
  </a-entity>
</a-entity>
