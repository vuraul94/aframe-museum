<!--
  Station 4 · Multimedia: spatial audio, video dialog, iframes, robot arm, fonts

  Room fragment, not a full page. js/core/museum-loader.js inserts it into:
    - index.html → one <a-scene> with all the rooms
    - room.html?station=4 → its own <a-scene>
  Top-level elements go inside #museum, unless they say otherwise with
  data-mount="scene" (scene root: survives hide-on-enter-ar) or data-mount="body".
  Relative URLs resolve against the page (the site root), not this folder.
-->

<!-- Video for the dialog. data-mount="body": goes in <body>, outside the scene (it does not delay the load);
     file in public/assets/media (Big Buck Bunny trailer, CC BY 3.0). -->
<video id="trailer" data-mount="body" preload="auto" playsinline webkit-playsinline loop style="display: none">
  <!-- The browser picks the first format it can decode -->
  <source src="assets/media/big-buck-bunny-trailer.m4v" type='video/mp4; codecs="avc1.42E01E, mp4a.40.2"'>
  <source src="assets/media/big-buck-bunny-trailer.webm" type='video/webm; codecs="vp9, opus"'>
</video>

<!-- ============ STATION 4 · MULTIMEDIA AND MODELS ============ -->
<a-entity id="st4" museum-station="index: 3; name: Multimedia" position="0 0 -42">
  <a-entity canvas-panel="id: s4-title; width: 4.4" position="0 4.2 -6.8"></a-entity>

  <!-- Spatial audio (left) -->
  <a-entity position="-3.6 0 -1.5" rotation="0 30 0">
    <a-box position="0 0.85 0" width="0.7" height="1.1" depth="0.5" material="color: #20263a; roughness: 0.7" shadow="cast: true" audio-toggle="#speaker">
      <a-cylinder id="spk-cone" position="0 0.15 0.26" rotation="90 0 0" radius="0.22" height="0.04" material="color: #7b61ff; metalness: 0.4; roughness: 0.4"></a-cylinder>
      <a-cylinder position="0 -0.3 0.26" rotation="90 0 0" radius="0.08" height="0.04" material="color: #7b61ff; metalness: 0.4; roughness: 0.4"></a-cylinder>
    </a-box>
    <a-sound id="speaker" procedural-audio position="0 0.9 0.3"></a-sound>
    <a-entity audio-visualizer="sound: #speaker; bars: 12; cone: #spk-cone" position="0 1.5 0"></a-entity>
    <a-entity ui-button="label: Play; color: #6a50ee; icon: ▶" audio-toggle="#speaker" position="-0.4 0.15 0.5"></a-entity>
    <a-entity ui-button="label: View info; color: #6a50ee" info-toggle="#p-audio" position="0.4 0.15 0.5"></a-entity>
    <a-entity id="p-audio" canvas-panel="id: audio; width: 2.4" popup position="0 2.65 0.5"></a-entity>
  </a-entity>

  <!-- Hierarchical model: robotic arm (center) -->
  <a-entity id="robot" position="0 0 -2.4">
    <a-cylinder radius="0.55" height="0.14" position="0 0.07 0" material="color: #2a3042; metalness: 0.6; roughness: 0.4" shadow="cast: true; receive: true"></a-cylinder>
    <a-entity position="0 0.14 0" animation="property: rotation; from: 0 -50 0; to: 0 50 0; dir: alternate; loop: true; dur: 3200; easing: easeInOutSine">
      <a-cylinder radius="0.32" height="0.3" position="0 0.15 0" material="color: #c9ced8; metalness: 0.7; roughness: 0.3" shadow="cast: true"></a-cylinder>
      <a-entity position="0 0.38 0" animation="property: rotation; from: 0 0 -25; to: 0 0 20; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine">
        <a-sphere radius="0.16" material="color: #7b61ff; metalness: 0.4; roughness: 0.3" shadow="cast: true"></a-sphere>
        <a-box position="0 0.5 0" width="0.16" height="1" depth="0.16" material="color: #c9ced8; metalness: 0.7; roughness: 0.3" shadow="cast: true"></a-box>
        <a-entity position="0 1 0" animation="property: rotation; from: 0 0 20; to: 0 0 75; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
          <a-sphere radius="0.12" material="color: #7b61ff; metalness: 0.4; roughness: 0.3" shadow="cast: true"></a-sphere>
          <a-box position="0 0.4 0" width="0.12" height="0.8" depth="0.12" material="color: #c9ced8; metalness: 0.7; roughness: 0.3" shadow="cast: true"></a-box>
          <a-entity position="0 0.8 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 2500; easing: linear">
            <a-cylinder radius="0.09" height="0.08" material="color: #7b61ff; metalness: 0.4; roughness: 0.3" shadow="cast: true"></a-cylinder>
            <a-box position="-0.06 0.14 0" width="0.03" height="0.2" depth="0.06" material="color: #ffb400" shadow="cast: true"
                   animation="property: position; from: -0.06 0.14 0; to: -0.025 0.14 0; dir: alternate; loop: true; dur: 700"></a-box>
            <a-box position="0.06 0.14 0" width="0.03" height="0.2" depth="0.06" material="color: #ffb400" shadow="cast: true"
                   animation="property: position; from: 0.06 0.14 0; to: 0.025 0.14 0; dir: alternate; loop: true; dur: 700"></a-box>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>
    <a-entity ui-button="label: View info; color: #6a50ee" info-toggle="#p-model" position="0 0.3 0.75"></a-entity>
  </a-entity>
  <a-entity id="p-model" canvas-panel="id: model; width: 2.4" popup position="0 2.7 -1.0"></a-entity>

  <!-- Iframe kiosk (back right): a web page and a YouTube video inside the 3D scene -->
  <a-entity position="3.3 0 -4.9" rotation="0 -20 0">
    <a-box position="0 0.5 0" width="1.5" height="1" depth="0.45" material="color: #2a3042; roughness: 0.6"></a-box>
    <a-box position="0 1.55 -0.1" width="1.5" height="0.95" depth="0.08" material="color: #141a2b; roughness: 0.8"></a-box>
    <a-entity canvas-label="text: ⧉ IFRAME; width: 1.2; color: #c9bcff; size: 90" position="0 1.6 -0.05"></a-entity>
    <a-entity ui-button="label: Web · YouTube; color: #6a50ee; icon: ⧉; width: 0.75" iframe-control="action: open; dialog: #iframeDialog; screen: #webScreen; src: https://aframe.io/docs/1.7.0/introduction/; title: A-Frame docs" position="-0.38 1.12 0.24"></a-entity>
    <a-entity ui-button="label: View info; color: #6a50ee" info-toggle="#p-iframe" position="0.38 1.12 0.24"></a-entity>
    <a-entity id="p-iframe" canvas-panel="id: iframe; width: 2.5" popup position="0 2.8 0.4"></a-entity>
  </a-entity>
  <!-- Iframe dialog, in front of its kiosk (nothing 3D between it and the visitor: the DOM iframe is always drawn on top): the screen is a 3D plane; html-iframe glues a real <iframe> on top (CSS3D) -->
  <a-entity id="iframeDialog" popup position="1.65 1.95 -3.2" rotation="0 -15 0" iframe-dialog="screen: #webScreen"
            dialog-frame="title: <iframe> in 3D · web page and YouTube; subtitle: CSS3D: real DOM aligned with the 3D camera (scroll and click it); credits: aframe.io docs · YouTube: Big Buck Bunny, Blender Foundation (CC BY 3.0)">
    <a-entity id="webScreen" html-iframe="width: 2.6; height: 1.4625; pxWidth: 1024"></a-entity>
    <a-entity ui-button="label: Website; color: #6a50ee; icon: ⧉" iframe-control="screen: #webScreen; src: https://aframe.io/docs/1.7.0/introduction/; title: A-Frame docs" position="-0.85 -0.95 0.01"></a-entity>
    <a-entity ui-button="label: YouTube; color: #d62f2f; icon: ▶" iframe-control="screen: #webScreen; src: https://www.youtube-nocookie.com/embed/YE7VzlLtp-4?rel=0; title: YouTube" position="0 -0.95 0.01"></a-entity>
    <a-entity ui-button="label: Close; color: #3a3f55; icon: ✕" iframe-control="action: close; dialog: #iframeDialog; screen: #webScreen" position="0.85 -0.95 0.01"></a-entity>
  </a-entity>

  <!-- Video kiosk (back left): opens a 3D dialog with <a-video> -->
  <a-entity position="-3.3 0 -4.9" rotation="0 20 0">
    <a-box position="0 0.5 0" width="1.5" height="1" depth="0.45" material="color: #2a3042; roughness: 0.6"></a-box>
    <a-box position="0 1.55 -0.1" width="1.5" height="0.95" depth="0.08" material="color: #141a2b; roughness: 0.8"></a-box>
    <a-entity canvas-label="text: ▶ VIDEO; width: 1.2; color: #c9bcff; size: 90" position="0 1.6 -0.05"></a-entity>
    <a-entity ui-button="label: Watch video; color: #6a50ee; icon: ▶; width: 0.75" video-control="video: #trailer; action: open; dialog: #videoDialog" position="-0.38 1.12 0.24"></a-entity>
    <a-entity ui-button="label: View info; color: #6a50ee" info-toggle="#p-video" position="0.38 1.12 0.24"></a-entity>
    <a-entity id="p-video" canvas-panel="id: video; width: 2.4" popup position="0 2.75 0.4"></a-entity>
  </a-entity>
  <!-- The dialog: frame + <a-video> + controls (a popup). It opens in front of its kiosk, facing the visitor -->
  <a-entity id="videoDialog" popup position="-1.65 1.95 -3.2" rotation="0 15 0" video-dialog="video: #trailer"
            dialog-frame="title: Big Buck Bunny · trailer; subtitle: <video> element + <a-video> = THREE.VideoTexture on a plane; credits: (c) 2008 Blender Foundation · peach.blender.org · CC BY 3.0">
    <a-video src="#trailer" width="2.6" height="1.4625" position="0 0 0.005"></a-video>
    <a-entity ui-button="label: Play; color: #6a50ee; icon: ▶" video-control="video: #trailer; action: toggle" position="-0.85 -1.0 0.01"></a-entity>
    <a-entity ui-button="label: Restart; color: #6a50ee; icon: ↺" video-control="video: #trailer; action: restart" position="0 -1.0 0.01"></a-entity>
    <a-entity ui-button="label: Close; color: #3a3f55; icon: ✕" video-control="video: #trailer; action: close; dialog: #videoDialog" position="0.85 -1.0 0.01"></a-entity>
  </a-entity>

  <!-- SDF text with several fonts (right) -->
  <a-entity position="3.6 0 -1.5" rotation="0 -30 0">
    <a-plane position="0 1.3 -0.05" width="2.4" height="1.9" material="color: #141a2b; roughness: 1"></a-plane>
    <a-text value="a-text (MSDF)" font="exo2bold" color="#ffb400" position="-1.05 2.0 0" width="3.4"></a-text>
    <a-text value="Roboto (default)" color="#ffffff" position="-1.05 1.7 0" width="3"></a-text>
    <a-text value="Mozilla VR" font="mozillavr" color="#4cc9f0" position="-1.05 1.45 0" width="3"></a-text>
    <a-text value="Monoid { code }" font="monoid" color="#addb67" position="-1.05 1.2 0" width="3"></a-text>
    <a-text value="Kelson Sans" font="kelsonsans" color="#ef2d5e" position="-1.05 0.95 0" width="3"></a-text>
    <a-text value="Aileron Semibold" font="aileronsemibold" color="#c792ea" position="-1.05 0.7 0" width="3"></a-text>
    <a-entity ui-button="label: View info; color: #6a50ee" info-toggle="#p-fonts" position="0 0.2 0.1"></a-entity>
    <a-entity id="p-fonts" canvas-panel="id: fonts; width: 2.4" popup position="0 2.75 0.5"></a-entity>
  </a-entity>
</a-entity>
