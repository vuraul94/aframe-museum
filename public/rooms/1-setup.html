<!--
  Station 1 · Setup: adding A-Frame to a page, the minimal scene, configuring <a-scene>

  Room fragment, not a full page. js/core/museum-loader.js inserts it into:
    - index.html → one <a-scene> with all the rooms
    - room.html?station=1 → its own <a-scene>
  Top-level elements go inside #museum, unless they say otherwise with
  data-mount="scene" (scene root: survives hide-on-enter-ar) or data-mount="body".
  Relative URLs resolve against the page (the site root), not this folder.
-->

<!-- ============ STATION 1 · SETUP ============ -->
<a-entity id="st0" museum-station="index: 0; name: Setup" position="0 0 0">
  <a-entity canvas-panel="id: setup-title; width: 4.4" position="0 4.2 -6.8"></a-entity>

  <!-- Step 1: include A-Frame (left) -->
  <a-entity position="-3.6 0 -1.5" rotation="0 30 0">
    <a-entity canvas-panel="id: setup-include; width: 2.4" position="0 1.95 0"></a-entity>
    <a-entity ui-button="label: Serving; color: #84c41a; icon: ⇅" info-toggle="#p-serve" position="0 0.45 0.1"></a-entity>
    <a-entity id="p-serve" canvas-panel="id: setup-serve; width: 2.5" popup position="0 2.2 0.5"></a-entity>
  </a-entity>

  <!-- Step 2: the classic "Hello WebXR" scene, live and scaled down (center) -->
  <a-entity position="0 0 -2.2">
    <a-cylinder radius="1.05" height="0.6" position="0 0.3 0" material="color: #2a3042; roughness: 0.6"></a-cylinder>
    <!-- Its <a-sky color="#ECECEC">, as a half dome behind it -->
    <a-sphere radius="1" position="0 0.6 0" theta-length="90" phi-start="180" phi-length="180" scale="1 1.2 1"
              material="color: #ECECEC; side: double; roughness: 1"></a-sphere>
    <!-- Same markup as the panel, scaled 0.3 around its own origin -->
    <a-entity position="0 0.61 1.2" scale="0.3 0.3 0.3">
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" shadow="cast: true"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E" shadow="cast: true"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D" shadow="cast: true"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" shadow="receive: true"></a-plane>
    </a-entity>
    <a-entity ui-button="label: View info; color: #84c41a" info-toggle="#p-hello" position="0 0.3 1.08"></a-entity>
    <a-entity id="p-hello" canvas-panel="id: setup-hello; width: 2.5" popup position="0 2.5 0.6"></a-entity>
  </a-entity>

  <!-- Step 3: configuring <a-scene>, with live toggles (right) -->
  <a-entity position="3.6 0 -1.5" rotation="0 -30 0">
    <a-entity canvas-panel="id: setup-scene; width: 2.4" position="0 1.95 0"></a-entity>
    <a-entity ui-button="color: #84c41a; width: 0.62" scene-toggle="fog" position="-0.68 0.45 0.1"></a-entity>
    <a-entity ui-button="color: #84c41a; width: 0.62" scene-toggle="stats" position="0 0.45 0.1"></a-entity>
    <a-entity ui-button="label: Defaults; color: #84c41a; width: 0.62" info-toggle="#p-defaults" position="0.68 0.45 0.1"></a-entity>
    <a-entity id="p-defaults" canvas-panel="id: setup-defaults; width: 2.5" popup position="0 2.2 0.5"></a-entity>
  </a-entity>
</a-entity>
