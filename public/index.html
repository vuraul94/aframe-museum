<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A-Frame · Interactive Museum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="css/hud.css">

  <!-- Relative paths everywhere: the same files work with `npm start` and under /<repo>/ on GitHub Pages -->
  <!-- A-Frame internal assets (MSDF fonts, controller models) served and cached by the Node server -->
  <script>window.AFRAME_CDN_ROOT = 'vendor/cdn/';</script>
  <!-- A-Frame (includes Three.js). The server downloads it once and caches it in ./vendor -->
  <script src="vendor/aframe.min.js"></script>
  <!-- Custom systems and components (ES modules) -->
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <!-- ================= 2D HUD (presentation mode) ================= -->
  <div id="hud">
    <span class="brand">A-Frame</span>
    <button data-station="0"><b>1</b>Setup</button>
    <button data-station="1"><b>2</b>Entrance</button>
    <button data-station="2"><b>3</b>Motion</button>
    <button data-station="3"><b>4</b>Interaction</button>
    <button data-station="4"><b>5</b>Multimedia</button>
    <button data-station="5"><b>6</b>Forest · AR</button>
    <button id="inspectorBtn" class="tool" title="A-Frame Inspector (E or Ctrl+Alt+I)">🛠 Inspector</button>
    <span id="timer" title="T: start/pause · R: reset">10:00</span>
    <!-- Same museum, one <a-scene> per room (room.html mounts a single rooms/*.html file) -->
    <a id="modeLink" class="mode" href="room.html?station=1" title="Switch between one scene and one scene per room">⇄ Scene per room</a>
  </div>
  <div id="help">
    <kbd>1</kbd>–<kbd>6</kbd> / <kbd>N</kbd> <kbd>P</kbd> / <kbd>PageDown</kbd> <kbd>PageUp</kbd> stations ·
    <kbd>WASD</kbd> + drag: move · <kbd>I</kbd> panels ·
    <kbd>E</kbd> / <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>I</kbd> Inspector ·
    <kbd>G</kbd> gaze · <kbd>T</kbd>/<kbd>R</kbd> Timer · <kbd>H</kbd> hide HUD
  </div>
  <div id="toast"></div>

  <!-- ================= SCENE (shell) =================
       A <template> is inert: A-Frame does not start it. The loader clones it,
       adds the rooms (all of them here, one in room.html) and then mounts it. -->
  <template id="scene-template">
  <a-scene
    station-nav
    procedural-environment
    ar-mode-handler
    renderer="antialias: true; colorManagement: true; toneMapping: ACESFilmic; exposure: 1.1"
    shadow="type: pcfsoft"
    webxr="optionalFeatures: hit-test, local-floor, bounded-floor"
    xr-mode-ui="enabled: true; XRMode: xr"
    ar-hit-test="target: #arExhibit"
    inspector="url: vendor/aframe-inspector.min.js"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .clickable; far: 30"
    loading-screen="dotsColor: #ef2d5e; backgroundColor: #0b0f1a">

    <!-- ---------- Player: rig + camera + controllers ---------- -->
    <a-entity id="rig" position="0 0 4" room-bounds>
      <a-entity id="camera" camera position="0 1.6 0"
                look-controls="pointerLockEnabled: false"
                wasd-controls="acceleration: 35">
        <!-- Gaze cursor (fuse). Enabled with the G key or on mobile -->
        <a-entity id="gaze" position="0 0 -0.8" visible="false"
                  cursor="fuse: true; fuseTimeout: 1300"
                  raycaster="objects: .clickable; far: 15; enabled: false"
                  geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.013"
                  material="color: #ffffff; shader: flat"
                  animation__fusing="property: scale; startEvents: fusing; from: 1 1 1; to: 0.35 0.35 0.35; dur: 1300"
                  animation__leave="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 150"></a-entity>
      </a-entity>
      <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .clickable; far: 20"
                thumbstick-locomotion vr-station-buttons></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .clickable; far: 20"
                snap-turn vr-station-buttons></a-entity>
    </a-entity>

    <!-- ---------- Global lights (stay on in AR) ---------- -->
    <a-entity light="type: hemisphere; color: #dfe6ff; groundColor: #2a2230; intensity: 1.2"></a-entity>
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.3"></a-entity>

    <!-- ================= MUSEUM (hidden when entering AR) ================= -->
    <a-entity id="museum" museum-architecture hide-on-enter-ar>
      <!-- Rooms are inserted here from public/rooms/*.html (js/core/museum-loader.js) -->
    </a-entity>
    <!-- ================= END OF MUSEUM ================= -->
    <!-- The fox (#arExhibit, data-mount="scene") is added here from rooms/6-forest.html -->
  </a-scene>
  </template>

</body>
</html>
